# ==============================================================
# netlify.toml — Ite Nnem Native Kitchen
# Using Edge Functions to bypass InfinityFree Bot Protection
# ==============================================================

[build]
  publish = "."

# ── Edge Function Routing ─────────────────────────────────────
# This runs our proxy.js logic for every /api/ request
[[edge_functions]]
  path = "/api/*"
  function = "proxy"

# ── SPA fallback ──────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
